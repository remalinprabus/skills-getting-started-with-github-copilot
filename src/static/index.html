<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Word Occurrence Counter</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <h1>Word Occurrence Counter</h1>
      <h2>Upload a text file and find a word count</h2>
    </header>

    <main>
      <section id="word-counter-container">
        <h3>Count Word Occurrences</h3>
        <form id="word-count-form">
          <div class="form-group">
            <label for="word">Word to count:</label>
            <input type="text" id="word" required placeholder="Enter a word" />
          </div>
          <div class="form-group">
            <label for="text-file">Text file:</label>
            <input type="file" id="text-file" accept=".txt,text/plain" required />
          </div>
          <button type="submit">Count occurrences</button>
        </form>
        <div id="message" class="hidden"></div>
      </section>
    </main>

    <footer>
      <p>&copy; 2026 Word Counter</p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
